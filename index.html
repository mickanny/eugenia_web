<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>綿綿泡芙的單字大對決！Pokemon English Battle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'DFKai-SB', sans-serif;
      background: radial-gradient(circle at 50% 15%, #ffe4e6 0%, #fbcfe8 45%, #c084fc 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Standard horizontal ruby styling for clear, non-inverted Bopomofo above characters */
    ruby {
      ruby-position: over;
      ruby-align: center;
      display: inline-ruby;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'DFKai-SB', sans-serif;
      line-height: 1.6;
    }

    rt {
      font-size: 0.52em;
      letter-spacing: 0.5px;
      color: #334155;
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }

    .retro-box {
      background: #ffffff;
      border: 4px solid #334155;
      box-shadow: 0 8px 0px #1e293b, 0 16px 20px rgba(0,0,0,0.15);
      border-radius: 22px;
    }

    .hp-bar-fill {
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Pokemon Animations */
    @keyframes floatPet {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }

    @keyframes idleOpponent {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }

    @keyframes fairyAttackAnim {
      0% { transform: translateX(0) scale(1); }
      25% { transform: translateX(-25px) scale(0.92); }
      60% { transform: translateX(85px) scale(1.2) rotate(14deg); }
      100% { transform: translateX(0) scale(1) rotate(0deg); }
    }

    @keyframes hitHurtAnim {
      0%, 100% { transform: translateX(0); filter: brightness(1); }
      20% { transform: translateX(-14px); filter: brightness(2) drop-shadow(0 0 10px red); }
      40% { transform: translateX(14px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    @keyframes faintAnim {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      50% { transform: translateY(25px) rotate(25deg); opacity: 0.6; }
      100% { transform: translateY(110px) scale(0.2); opacity: 0; }
    }

    .player-float { animation: floatPet 2.5s ease-in-out infinite; }
    .opponent-idle { animation: idleOpponent 3s ease-in-out infinite; }
    .anim-attack { animation: fairyAttackAnim 0.6s ease-out forwards; }
    .anim-hurt { animation: hitHurtAnim 0.6s ease-out forwards; }
    .anim-faint { animation: faintAnim 0.7s ease-in forwards; }

    .word-svg-preview {
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .word-svg-preview:hover {
      transform: scale(1.08) rotate(3deg);
    }

    .pic-card-option {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 3px solid #e2e8f0;
    }
    .pic-card-option:hover {
      border-color: #ec4899;
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 10px 15px -3px rgba(236, 72, 153, 0.3);
    }
    .pic-card-option:active {
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>

    // Web Audio Sound FX Synth
    const AudioFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playTone(freq, type, duration, delay = 0) {
        try {
          this.init();
          if (!this.ctx) return;
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          }, delay * 1000);
        } catch (e) {}
      },
      correct() {
        this.playTone(523.25, 'triangle', 0.15, 0);
        this.playTone(659.25, 'triangle', 0.15, 0.08);
        this.playTone(783.99, 'triangle', 0.18, 0.16);
        this.playTone(1046.50, 'triangle', 0.35, 0.24);
      },
      wrong() {
        this.playTone(220, 'sawtooth', 0.18, 0);
        this.playTone(180, 'sawtooth', 0.28, 0.14);
      },
      attack() {
        this.playTone(440, 'sine', 0.1, 0);
        this.playTone(880, 'sine', 0.18, 0.06);
      },
      faint() {
        this.playTone(400, 'square', 0.12, 0);
        this.playTone(340, 'square', 0.12, 0.1);
        this.playTone(280, 'square', 0.15, 0.2);
        this.playTone(200, 'square', 0.35, 0.3);
      }
    };

    const OPPONENTS = [
      { name: "皮卡丘", id: 25 },

      { name: "木木梟", id: 722 }
    ];

    let currentMode = 'quiz';
    let currentWordIndex = 0;
    let questionsDeck = [];
    let defeatedCount = 0;
    let streakCount = 0;
    let totalScore = 0;
    let isProcessingAnswer = false;
    let currentOpponent = null;

    function initGame() {
      questionsDeck = [...WORDS].sort(() => Math.random() - 0.5);

  <script>
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('nav-quiz').className = mode === 'quiz' 
        ? "flex-1 py-2 px-1 rounded-xl font-black text-sm sm:text-base border-2 border-pink-500 bg-pink-500 text-white shadow-sm transition hover:scale-105 active:scale-95"
        : "flex-1 py-2 px-1 rounded-xl font-black text-sm sm:text-base border-2 border-pink-500 bg-white text-pink-600 shadow-sm transition hover:scale-105 active:scale-95";
      
      document.getElementById('nav-listen').className = mode === 'listen'
        ? "flex-1 py-2 px-1 rounded-xl font-black text-sm sm:text-base border-2 border-indigo-500 bg-indigo-500 text-white shadow-sm transition hover:scale-105 active:scale-95"
        : "flex-1 py-2 px-1 rounded-xl font-black text-sm sm:text-base border-2 border-indigo-500 bg-white text-indigo-600 shadow-sm transition hover:scale-105 active:scale-95";

      document.getElementById('nav-spell').className = mode === 'spell'
        ? "flex-1 py-2 px-1 rounded-xl font-black text-sm sm:text-base border-2 border-purple-500 bg-purple-500 text-white shadow-sm transition hover:scale-105 active:scale-95"
        : "flex-1 py-2 px-1 rounded-xl font-black text-sm sm:text-base border-2 border-purple-500 bg-white text-purple-600 shadow-sm transition hover:scale-105 active:scale-95";

      document.getElementById('quiz-choices-wrap').classList.toggle('hidden', mode !== 'quiz');
      document.getElementById('listen-choices-wrap').classList.toggle('hidden', mode !== 'listen');
      document.getElementById('spell-input-wrap').classList.toggle('hidden', mode !== 'spell');

      initGame();
    }

    function spawnNewOpponent() {
      const opp = OPPONENTS[Math.floor(Math.random() * OPPONENTS.length)];
      currentOpponent = opp;
      
      const oppImg = document.getElementById('opponent-img');
      oppImg.className = "w-full h-full object-contain opponent-idle relative z-10 filter drop-shadow-md";
      oppImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${opp.id}.png`;
      document.getElementById('opponent-name').innerText = opp.name;
      document.getElementById('opponent-hp-bar').style.width = '100%';
      document.getElementById('opponent-hp-bar').className = 'hp-bar-fill h-full bg-emerald-500 w-full';

      setBattleMessage(`野生的 ${opp.name} 出現了！綿綿泡芙準備迎戰！`);
    }

    function setBattleMessage(htmlText) {
      document.getElementById('battle-msg').innerHTML = htmlText;
    }

    function playCurrentWordAudio() {
      const currentWordObj = questionsDeck[currentWordIndex];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(currentWordObj.word);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      }
    }

    function renderQuestion() {
      isProcessingAnswer = false;
      const wordObj = questionsDeck[currentWordIndex];
      const feedbackEl = document.getElementById('feedback-area');
      feedbackEl.innerHTML = '';

      document.getElementById('cat-badge').innerHTML = wordObj.catRuby;

      const svgWrap = document.getElementById('prompt-svg-wrap');
      const textWrap = document.getElementById('prompt-text');

      if (currentMode === 'quiz') {
        svgWrap.classList.remove('hidden');
        svgWrap.innerHTML = SVG_LIB[wordObj.key];
        textWrap.innerHTML = wordObj.zhRuby;
        renderTextOptions(wordObj);
      } 
      else if (currentMode === 'listen') {
        svgWrap.classList.add('hidden');
        textWrap.innerHTML = `🎧 <ruby>請<rt>ㄑㄧㄥˇ</rt></ruby><ruby>聽<rt>ㄊㄧㄥ</rt></ruby><ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby><ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>擇<rt>ㄗㄜˊ</rt></ruby><ruby>圖<rt>ㄊㄨˊ</rt></ruby><ruby>片<rt>ㄆㄧㄢˋ</rt></ruby>`;
        renderPictureOptions(wordObj);
        setTimeout(playCurrentWordAudio, 250);
      } 
      else if (currentMode === 'spell') {
        svgWrap.classList.remove('hidden');
        svgWrap.innerHTML = SVG_LIB[wordObj.key];
        textWrap.innerHTML = wordObj.zhRuby;
        const input = document.getElementById('spell-input');
        input.value = '';
        input.disabled = false;
        setTimeout(() => input.focus(), 150);
      }
    }

    function renderTextOptions(currentObj) {
      const container = document.getElementById('quiz-choices-wrap');
      container.innerHTML = '';

      const pool = WORDS.filter(w => w.key !== currentObj.key);
      const randomThree = pool.sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [currentObj, ...randomThree].sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "py-3 px-2 bg-slate-50 hover:bg-pink-50 border-2 border-slate-300 hover:border-pink-500 rounded-xl font-black text-lg text-slate-800 transition active:scale-95 shadow-sm";
        btn.innerText = opt.word;
        btn.onclick = () => handleAnswer(opt.key === currentObj.key, btn, currentObj.word);
        container.appendChild(btn);
      });
    }

    function renderPictureOptions(currentObj) {
      const container = document.getElementById('listen-choices-wrap');
      container.innerHTML = '';

      const pool = WORDS.filter(w => w.key !== currentObj.key);
      const randomThree = pool.sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [currentObj, ...randomThree].sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const card = document.createElement('button');
        card.className = "pic-card-option bg-white rounded-2xl p-2.5 flex flex-col items-center justify-center shadow-sm relative";
        card.innerHTML = `
          <div class="w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center">
            ${SVG_LIB[opt.key]}
          </div>
          <div class="mt-1 text-xs font-bold text-slate-400">#選我</div>
        `;
        card.onclick = () => handleAnswer(opt.key === currentObj.key, card, currentObj.word);
        container.appendChild(card);
      });
    }

    function checkSpelling() {
      if (isProcessingAnswer) return;
      const input = document.getElementById('spell-input');
      const val = input.value.trim().toLowerCase();
      const currentObj = questionsDeck[currentWordIndex];

      if (!val) return;
      handleAnswer(val === currentObj.word.toLowerCase(), input, currentObj.word);
    }

    document.getElementById('spell-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkSpelling();
    });

    function handleAnswer(isCorrect, elementTarget, correctEnglish) {
      if (isProcessingAnswer) return;
      isProcessingAnswer = true;

      const playerImg = document.getElementById('player-img');
      const oppImg = document.getElementById('opponent-img');
      const oppHpBar = document.getElementById('opponent-hp-bar');
      const feedbackEl = document.getElementById('feedback-area');
      const attackFx = document.getElementById('attack-fx');

      if (isCorrect) {
        AudioFX.correct();
        streakCount++;
        totalScore += 20 + streakCount * 5;

        feedbackEl.innerHTML = `<span class="text-emerald-600">🎉 <ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>對<rt>ㄉㄨㄟˋ</rt></ruby><ruby>了<rt>˙ㄌㄜ</rt></ruby>！${correctEnglish}！</span>`;

        playerImg.classList.add('anim-attack');
        attackFx.classList.remove('hidden');

        setTimeout(() => {
          AudioFX.attack();
          oppImg.classList.add('anim-hurt');
          oppHpBar.style.width = '0%';
          oppHpBar.className = 'hp-bar-fill h-full bg-rose-500 w-0';

          setBattleMessage(`綿綿泡芙使用了<b>「妖精之風」</b>！對手 ${currentOpponent.name} 倒下了！`);
        }, 350);

        setTimeout(() => {
          AudioFX.faint();
          oppImg.classList.remove('anim-hurt');
          oppImg.classList.add('anim-faint');
          defeatedCount++;
          updateTopBar();
        }, 850);

        setTimeout(() => {
          playerImg.classList.remove('anim-attack');
          attackFx.classList.add('hidden');
          nextWordOrOpponent();
        }, 1600);

      } else {
        AudioFX.wrong();
        streakCount = 0;
        updateTopBar();

        feedbackEl.innerHTML = `<span class="text-rose-600">❌ <ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>了<rt>˙ㄌㄜ</rt></ruby>！<ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>是<rt>ㄕˋ</rt></ruby>：${correctEnglish}</span>`;
        setBattleMessage(`${currentOpponent.name} 展開了反擊！加油，別氣餒！`);

        playerImg.classList.add('anim-hurt');
        setTimeout(() => {
          playerImg.classList.remove('anim-hurt');
          playCurrentWordAudio();
        }, 600);

        setTimeout(() => {
          nextWordOrOpponent();
        }, 1800);
      }
    }

    function nextWordOrOpponent() {
      currentWordIndex++;
      if (currentWordIndex >= questionsDeck.length) {
        questionsDeck = [...WORDS].sort(() => Math.random() - 0.5);
        currentWordIndex = 0;
        setBattleMessage(`🎉 恭喜完成一輪練習！綿綿泡芙等級提升！新的挑戰來了！`);
      }
      spawnNewOpponent();
      renderQuestion();
    }

    function updateTopBar() {
      document.getElementById('defeat-count').innerText = `${defeatedCount} 隻`;
      document.getElementById('streak-count').innerText = `${streakCount} 題`;
      document.getElementById('score-count').innerText = `${totalScore} EXP`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initGame();
    });
  </script>
